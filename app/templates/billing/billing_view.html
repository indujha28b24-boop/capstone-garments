{% extends "base.html" %}
{% block title %}Invoice {{ invoice.invoice_number }} - FAB FORA INTERNATIONAL PVT. LTD.{% endblock %}
{% block header_title %}Commercial Tax Invoice{% endblock %}

{% block content %}
<div class="invoice-page-wrapper">
    <!-- Top Action Bar (Screen Only - Hidden in Print) -->
    <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2 no-print">
        <a href="{{ url_for(request.endpoint|replace('billing_view', 'billing_manage')) }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="bi bi-arrow-left me-1"></i> Back to Invoices
        </a>
        <div class="d-flex gap-2">
            <button type="button" onclick="window.print()" class="btn btn-outline-light btn-sm rounded-pill px-3 shadow-sm">
                <i class="bi bi-printer me-1"></i> Print Invoice
            </button>
            <a href="{{ url_for(request.endpoint|replace('billing_view', 'billing_pdf'), invoice_id=invoice.id) }}" class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
                <i class="bi bi-file-earmark-pdf me-1"></i> Download PDF
            </a>
        </div>
    </div>

    <!-- Professional A4 Tax Invoice Document Sheet -->
    {% include 'billing/_invoice_sheet.html' %}
</div>
{% endblock %}
